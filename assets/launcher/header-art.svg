<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 180" preserveAspectRatio="xMidYMid meet">
  <style>
    .deep { fill: #03140D; }
    .green-line { fill: none; stroke: #0E4F30; }
    .emerald { fill: #1F7448; }
    .emerald-line { fill: none; stroke: #1F7448; }
    .accent { fill: #5CE070; }
    .accent-line { fill: none; stroke: #5CE070; }
    .deep-stop { stop-color: #03140D; }
    .dark-green-stop { stop-color: #082318; }
    .green-stop { stop-color: #0E4F30; }
    .emerald-stop { stop-color: #1F7448; }
    .accent-stop { stop-color: #5CE070; }
    .shell-orange { color: #FF8A1F; }
    .shell-blue { color: #1E9DFF; }
    .shell-purple { color: #A844FF; }
    .shell-red { color: #FF2B3A; }
  </style>

  <defs>
    <linearGradient id="backdrop-fade" x1="860" y1="0" x2="1300" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" class="deep-stop" stop-opacity="0"/>
      <stop offset="1" class="deep-stop" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="ground-fade" x1="600" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" class="emerald-stop" stop-opacity="0"/>
      <stop offset="1" class="emerald-stop" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="water-fade" x1="900" y1="0" x2="1240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" class="dark-green-stop" stop-opacity="0"/>
      <stop offset="1" class="dark-green-stop" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="fence-fade" x1="960" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" class="emerald-stop" stop-opacity="0"/>
      <stop offset="1" class="emerald-stop" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="wall-fade" x1="1236" y1="0" x2="1462" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" class="emerald-stop" stop-opacity="0"/>
      <stop offset="1" class="emerald-stop" stop-opacity=".34"/>
    </linearGradient>
    <radialGradient id="ambient" cx="1532" cy="90" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" class="green-stop" stop-opacity=".34"/>
      <stop offset="1" class="green-stop" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="1532" cy="112" r="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" class="accent-stop" stop-opacity=".26"/>
      <stop offset="1" class="accent-stop" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mist">
      <stop offset="0" class="accent-stop" stop-opacity=".11"/>
      <stop offset="1" class="accent-stop" stop-opacity="0"/>
    </radialGradient>

    <g id="shell">
