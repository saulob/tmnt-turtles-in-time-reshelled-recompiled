      <ellipse rx="44" ry="52.5" fill="currentColor" fill-opacity=".1"/>
      <polygon points="12.2,0 6.1,12.3 -6.1,12.3 -12.2,0 -6.1,-12.3 6.1,-12.3" fill="currentColor" fill-opacity=".16"/>
      <g fill="none" stroke="currentColor">
        <ellipse rx="44" ry="52.5" stroke-opacity=".05" stroke-width="8"/>
        <ellipse rx="44" ry="52.5" stroke-opacity=".1" stroke-width="4.5"/>
        <ellipse rx="44" ry="52.5" stroke-width="2"/>
        <ellipse rx="38" ry="47" stroke-opacity=".7" stroke-width="1.1"/>
        <path d="M12.2 0L6.1 12.3M6.1 12.3L-6.1 12.3M-6.1 12.3L-12.2 0M-12.2 0L-6.1 -12.3M-6.1 -12.3L6.1 -12.3M6.1 -12.3L12.2 0M12.2 -24.5L6.1 -12.3M-6.1 -12.3L-12.2 -24.5M-12.2 -24.5L-6.1 -36.8M-6.1 -36.8L6.1 -36.8M6.1 -36.8L12.2 -24.5M12.2 24.5L6.1 36.8M6.1 36.8L-6.1 36.8M-6.1 36.8L-12.2 24.5M-12.2 24.5L-6.1 12.3M6.1 12.3L12.2 24.5M-12.2 -0L-24.4 0M-24.4 0L-30.5 -12.3M-30.5 -12.3L-24.4 -24.5M-24.4 -24.5L-12.2 -24.5M-12.2 24.5L-24.4 24.5M-24.4 24.5L-30.5 12.3M-30.5 12.3L-24.4 0M30.5 -12.3L24.4 -0M24.4 -0L12.2 0M12.2 -24.5L24.4 -24.5M24.4 -24.5L30.5 -12.3M30.5 12.3L24.4 24.5M24.4 24.5L12.2 24.5M24.4 0L30.5 12.3M-6.1 -36.8L-7.6 -46M6.1 -36.8L7.6 -46M6.1 36.8L7.6 46M-6.1 36.8L-7.6 46M-30.5 -12.3L-36.1 -14.6M-24.4 -24.5L-29.5 -29.6M-24.4 24.5L-29.5 29.6M-30.5 12.3L-36.1 14.6M30.5 -12.3L36.1 -14.6M24.4 -24.5L29.5 -29.6M30.5 12.3L36.1 14.6M24.4 24.5L29.5 29.6" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M-32 80H32M-21 86H21M-10 92H10" stroke-opacity=".7" stroke-width="1.6"/>
      </g>
      <path d="M-36.3 -29.6A44 52.5 0 0 1 -6.6 -51.9" fill="none" stroke="#FFFFFF" stroke-opacity=".32" stroke-width=".9" stroke-linecap="round"/>
    </g>
  </defs>

  <g id="backdrop">
    <rect x="860" y="0" width="740" height="180" fill="url(#backdrop-fade)"/>
    <rect x="1140" y="0" width="460" height="180" fill="url(#ambient)"/>
    <ellipse cx="460" cy="150" rx="420" ry="20" fill="url(#mist)" fill-opacity=".3"/>
  </g>

  <g id="wall">
    <path d="M1236 16H1462M1236 38H1462M1236 60H1462M1236 82H1462M1236 104H1462M1236 126H1462M1236 148H1462M1250 16V38M1294 16V38M1338 16V38M1382 16V38M1426 16V38M1272 38V60M1316 38V60M1360 38V60M1404 38V60M1448 38V60M1250 60V82M1294 60V82M1338 60V82M1382 60V82M1426 60V82M1272 82V104M1316 82V104M1360 82V104M1404 82V104M1448 82V104M1250 104V126M1294 104V126M1338 104V126M1382 104V126M1426 104V126M1272 126V148M1316 126V148M1360 126V148M1404 126V148M1448 126V148" fill="none" stroke="url(#wall-fade)" stroke-width="1"/>
  </g>

  <g id="fence">
    <path d="M975 26V156M1118 26V156M1230 26V156M975 30H1230" fill="none" stroke="url(#fence-fade)" stroke-width="2"/>
    <path d="M975 156L975 156M975 130L1001 156M975 104L1027 156M975 78L1053 156M975 52L1079 156M979 30L1105 156M1005 30L1131 156M1031 30L1157 156M1057 30L1183 156M1083 30L1209 156M1109 30L1230 151M1135 30L1230 125M1161 30L1230 99M1187 30L1230 73M1213 30L1230 47M1230 156L1230 156M1230 130L1204 156M1230 104L1178 156M1230 78L1152 156M1230 52L1126 156M1226 30L1100 156M1200 30L1074 156M1174 30L1048 156M1148 30L1022 156M1122 30L996 156M1096 30L975 151M1070 30L975 125M1044 30L975 99M1018 30L975 73M992 30L975 47" fill="none" stroke="url(#fence-fade)" stroke-width=".7" stroke-opacity=".6"/>
  </g>

  <g id="pipes">
    <path d="M1270 9H1446A11 11 0 0 1 1457 20V156" class="green-line" stroke-width="6"/>
    <path d="M1270 7.2H1446A12.8 12.8 0 0 1 1458.8 20V156" class="emerald-line" stroke-opacity=".6" stroke-width="1"/>
    <rect x="1330" y="5" width="3" height="8" class="emerald" fill-opacity=".7"/>
    <rect x="1451" y="58" width="12" height="3" class="emerald" fill-opacity=".7"/>
  </g>

  <g id="tunnel">
    <path d="M1472 156V82A60 60 0 0 1 1592 82V156Z" class="deep"/>
    <path d="M1472 156V82A60 60 0 0 1 1592 82V156" class="emerald-line" stroke-opacity=".8" stroke-width="4"/>
    <path d="M1486 156V82A46 46 0 0 1 1578 82V156" class="emerald-line" stroke-opacity=".38" stroke-width="1"/>
    <path d="M1498 156V82A34 34 0 0 1 1566 82V156" class="emerald-line" stroke-opacity=".3" stroke-width="1"/>
    <path d="M1508 156V86A24 24 0 0 1 1556 86V156" class="emerald-line" stroke-opacity=".24" stroke-width="1"/>
    <circle cx="1532" cy="112" r="44" fill="url(#lamp)"/>
    <circle cx="1532" cy="112" r="2.2" class="accent" fill-opacity=".9"/>
    <circle cx="1532" cy="48" r="1.4" class="accent" fill-opacity=".6"/>
  </g>

  <g id="water">
    <path d="M600 156H1600" fill="none" stroke="url(#ground-fade)" stroke-width="1"/>
    <rect x="900" y="157" width="700" height="23" fill="url(#water-fade)"/>
    <path d="M1490 162H1574M1508 168H1556M1522 174H1542" class="accent-line" stroke-opacity=".55" stroke-width="1.2"/>
  </g>

  <g id="mist-layer">
    <ellipse cx="1120" cy="152" rx="280" ry="24" fill="url(#mist)"/>
    <ellipse cx="1420" cy="154" rx="220" ry="22" fill="url(#mist)"/>
  </g>

  <g id="shells">
    <use href="#shell" id="shell-1-orange" class="shell-orange" x="1062" y="82"/>
    <use href="#shell" id="shell-2-blue" class="shell-blue" x="1174" y="82"/>
    <use href="#shell" id="shell-3-purple" class="shell-purple" x="1286" y="82"/>
    <use href="#shell" id="shell-4-red" class="shell-red" x="1398" y="82"/>
  </g>

  <g id="particles" class="accent">
    <circle cx="1006" cy="44" r="1" fill-opacity=".2"/>
    <circle cx="1118" cy="16" r="1.1" fill-opacity=".26"/>
    <circle cx="1230" cy="16" r="1" fill-opacity=".24"/>
    <circle cx="1340" cy="20" r="1.1" fill-opacity=".28"/>
    <circle cx="1596" cy="30" r="1.2" fill-opacity=".3"/>
